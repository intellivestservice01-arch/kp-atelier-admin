<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KP Atelier — Admin Login</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <img src="assets/kp-logo.jpeg" alt="KP Atelier" class="login-logo" />
    <h1>KP Atelier</h1>
    <div class="sub">Admin Access</div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-gold btn-block" id="login-btn">Log in</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  Theme.init();

  // If already logged in, skip straight to dashboard
  if (Auth.getToken()) {
    window.location.href = "dashboard.html";
  }

  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("login-error");
  const loginBtn = document.getElementById("login-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const data = await apiRequest("/admin/login", { method: "POST", body: { email, password } });
      Auth.setToken(data.token);
      Auth.setAdmin(data.admin);
      window.location.href = "dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message || "Login failed. Check your details and try again.";
      errorBox.classList.add("show");
      loginBtn.disabled = false;
      loginBtn.textContent = "Log in";
    }
  });
</script>
</body>
</html>
